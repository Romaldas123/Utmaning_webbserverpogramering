<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agar / Slither Hybrid</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #121618;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #game {
      position: fixed;
      inset: 0;
      display: block;
      background: #f7fafc;
      cursor: crosshair;
      touch-action: none;
    }

    .lobby {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(18, 22, 24, 0.86);
    }

    .lobby.is-hidden {
      display: none;
    }

    .lobby-panel {
      width: min(420px, 100%);
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: #f8fafc;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .lobby-panel h1 {
      margin: 0 0 8px;
      color: #111827;
      font-size: 30px;
      line-height: 1.1;
    }

    .lobby-message {
      min-height: 22px;
      margin: 0 0 18px;
      color: #b42318;
      font-weight: 700;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
      color: #1f2937;
      font-weight: 700;
    }

    .field input[type="text"] {
      height: 44px;
      padding: 0 12px;
      border: 1px solid #c8d1dc;
      border-radius: 6px;
      font: inherit;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .color-row input[type="color"] {
      width: 52px;
      height: 44px;
      padding: 2px;
      border: 1px solid #c8d1dc;
      border-radius: 6px;
      background: white;
    }

    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .swatch {
      width: 28px;
      height: 28px;
      border: 2px solid transparent;
      border-radius: 50%;
      cursor: pointer;
    }

    .swatch.is-selected {
      border-color: #111827;
    }

    .play-button {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font: 800 16px system-ui, sans-serif;
      cursor: pointer;
    }

    .play-button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="lobby" class="lobby">
    <form id="lobbyForm" class="lobby-panel">
      <h1>Agar / Slither Hybrid</h1>
      <p id="lobbyMessage" class="lobby-message"></p>

      <label class="field">
        Namn
        <input id="playerName" type="text" maxlength="16" value="Spelare" autocomplete="off">
      </label>

      <label class="field">
        Färg
        <span class="color-row">
          <input id="playerColor" type="color" value="#2f6bde">
          <span id="colorSwatches" class="swatches"></span>
        </span>
      </label>

      <button class="play-button" type="submit">Spela</button>
    </form>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
  <script src="game.js"></script>
</body>
</html>
